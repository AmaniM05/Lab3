<div class="shopping-list">
  @for (item of items; track $index) {
    <div class="row-item">
      <span class="item">{{ item }}</span>
      <button type="button" (click)="itemDeleted.emit($index)">Delete</button>
    </div>
  } @empty {
    <p class="empty">Your shopping list is empty.</p>
  }
</div>
